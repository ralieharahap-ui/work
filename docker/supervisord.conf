[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Penjadwal Laravel — pengingat WhatsApp harian (tasks:remind-whatsapp) dan
; denyut kerja asisten AI tiap menit (agent:tick). Tanpa proses ini, seluruh
; Schedule::command() di routes/console.php tidak pernah dieksekusi.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Pekerja antrean — menjalankan pekerjaan asisten AI di latar belakang supaya
; layar web dan webhook Telegram membalas seketika, tidak menunggu pekerjaan
; selesai. Bila QUEUE_CONNECTION=sync, proses ini menganggur tanpa efek apa pun
; (pekerjaan berjalan langsung di dalam request), jadi aman untuk kedua mode.
; --max-time membuat pekerja berdaur ulang tiap jam agar kode baru terpakai
; setelah deploy dan memori proses tetap bersih.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --max-time=3600 --max-jobs=200
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=25
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
