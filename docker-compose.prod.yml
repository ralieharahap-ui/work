# ============================================================
#  Aplikasi Sumber Biomassa PT GEP — deployment produksi
#  Jalankan:
#    docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gep-biomassa:latest
    restart: unless-stopped
    environment:
      APP_NAME: "PT Geosys Energi Prima"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-gep_erp}
      DB_USERNAME: ${DB_USERNAME:-gep}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      TRUSTED_PROXIES: "*"
      SEED_ON_DEPLOY: ${SEED_ON_DEPLOY:-true}
      # Pengingat tugas via WhatsApp — bawaan mati sampai gateway siap.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-go_whatsapp}
      WHATSAPP_REMINDER_TIME: ${WHATSAPP_REMINDER_TIME:-08:00}
      WHATSAPP_REMINDER_DAYS: ${WHATSAPP_REMINDER_DAYS:-3,1,0}
      WHATSAPP_OVERDUE_EVERY_DAYS: ${WHATSAPP_OVERDUE_EVERY_DAYS:-1}
      WHATSAPP_GROUP_ENABLED: ${WHATSAPP_GROUP_ENABLED:-false}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
      # Alamat internal gateway; tidak perlu diekspos ke internet.
      GOWA_BASE_URL: ${GOWA_BASE_URL:-http://whatsapp:3000}
      GOWA_USERNAME: ${GOWA_USERNAME:-}
      GOWA_PASSWORD: ${GOWA_PASSWORD:-}
      GOWA_DEVICE_ID: ${GOWA_DEVICE_ID:-}
      # Alternatif gateway swakelola (WHATSAPP_DRIVER=waha)
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
    depends_on:
      db:
        condition: service_healthy
    networks: [gepnet]
    # Untuk akses langsung tanpa domain/HTTPS, buka baris di bawah
    # (mis. http://IP_SERVER:8000). Untuk HTTPS pakai service caddy.
    # ports:
    #   - "${APP_PORT:-8000}:80"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gep_erp}
      MYSQL_USER: ${DB_USERNAME:-gep}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks: [gepnet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── Gateway WhatsApp swakelola ────────────────────────────────────────
  # https://github.com/aldinokemal/go-whatsapp-web-multidevice
  #
  # Tersambung ke WhatsApp lewat pemindaian QR (nomor WhatsApp biasa milik
  # perusahaan), lalu aplikasi mengirim pengingat ke nomor pribadi tiap PIC
  # melalui REST API-nya. Aktifkan dengan profil `whatsapp`:
  #
  #   docker compose --env-file .env.production -f docker-compose.prod.yml \
  #     --profile whatsapp up -d --build
  #
  # Pemindaian QR pertama kali: buka dasborn gateway lewat terowongan SSH
  # (aman, tanpa membuka port ke internet):
  #
  #   ssh -L 3000:127.0.0.1:3000 user@server
  #   lalu buka http://127.0.0.1:3000 di peramban lokal
  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    restart: unless-stopped
    profiles: ["whatsapp"]
    environment:
      APP_PORT: "3000"
      APP_HOST: 0.0.0.0
      APP_DEBUG: "false"
      # Wajib diisi: pelindung REST API gateway (format user:pass).
      APP_BASIC_AUTH: ${GOWA_USERNAME}:${GOWA_PASSWORD}
      DB_URI: file:storages/whatsapp.db?_foreign_keys=on
      WHATSAPP_ACCOUNT_VALIDATION: "true"
      WHATSAPP_AUTO_REPLY: ""
    volumes:
      - gowa_storage:/app/storages
    networks: [gepnet]
    # Sengaja TIDAK dipublikasikan ke host: sesi WhatsApp perusahaan tidak boleh
    # dapat dijangkau dari internet. Akses dasbornya lewat terowongan SSH di atas.
    # Bila memang perlu, buka hanya ke localhost server:
    # ports:
    #   - "127.0.0.1:3000:3000"

  # ── Alternatif: gateway WAHA (WhatsApp HTTP API) ──────────────────────
  # https://github.com/devlikeapro/waha
  #
  # Pilih salah satu saja — `whatsapp` (go-whatsapp-web-multidevice) ATAU
  # `waha` — lalu samakan WHATSAPP_DRIVER dengan yang dipakai. WAHA menarik
  # bila tim sudah memakainya untuk hal lain (mis. integrasi Chatwoot).
  #
  #   docker compose --env-file .env.production -f docker-compose.prod.yml \
  #     --profile waha up -d --build
  #
  # Pemindaian QR: sama seperti gateway satunya, lewat terowongan SSH
  #   ssh -L 3000:127.0.0.1:3000 user@server  →  http://127.0.0.1:3000
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    profiles: ["waha"]
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WAHA_PRINT_QR: "false"
      # Bangkitkan ulang sesi otomatis setelah container di-restart.
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_START_SESSION: ${WAHA_SESSION:-default}
    volumes:
      - waha_sessions:/app/.sessions
    networks: [gepnet]
    # Sama seperti gateway satunya: sengaja tidak dipublikasikan ke internet.
    # ports:
    #   - "127.0.0.1:3000:3000"

  # HTTPS otomatis untuk domain Anda (Let's Encrypt). Butuh domain diarahkan ke IP server.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [gepnet]

networks:
  gepnet:

volumes:
  dbdata:
  caddy_data:
  caddy_config:
  # Sesi WhatsApp gateway — JANGAN dihapus, menghapusnya berarti harus
  # memindai ulang QR dan menyambungkan nomornya dari awal.
  gowa_storage:
  waha_sessions:
